<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D7EF7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A6DE0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FD1C5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38B2AC;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded rect -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bgGrad)" filter="url(#glow)"/>
  
  <!-- Chat bubble shape -->
  <path d="M28 36 L100 36 L100 72 L88 72 L76 92 L76 72 L28 72 Z" 
        fill="white" 
        fill-opacity="0.95"
        stroke="url(#accentGrad)"
        stroke-width="1.5"/>
  
  <!-- AI brain/spark icon inside bubble -->
  <g transform="translate(64, 58)">
    <!-- Brain left hemisphere -->
    <path d="M-18 -6 
             C-18 -10, -14 -13, -10 -13
             C-6 -13, -2 -10, -2 -6
             C-2 -2, -6 1, -10 1
             C-14 1, -18 -2, -18 -6 Z"
          fill="url(#accentGrad)"
          opacity="0.9"/>
    
    <!-- Brain right hemisphere -->
    <path d="M2 -6 
             C2 -10, 6 -13, 10 -13
             C14 -13, 18 -10, 18 -6
             C18 -2, 14 1, 10 1
             C6 1, 2 -2, 2 -6 Z"
          fill="url(#accentGrad)"
          opacity="0.9"/>
    
    <!-- Center line -->
    <line x1="0" y1="-10" x2="0" y2="10" 
          stroke="white" 
          stroke-width="1.5" 
          stroke-opacity="0.6"
          stroke-linecap="round"/>
    
    <!-- Sparkles -->
    <g fill="white" opacity="0.9">
      <circle cx="-24" cy="-16" r="2.5"/>
      <circle cx="24" cy="-16" r="2"/>
      <circle cx="-20" cy="14" r="1.5"/>
      <circle cx="20" cy="14" r="1.5"/>
    </g>
  </g>
  
  <!-- Three dots indicator at bottom of bubble -->
  <g transform="translate(64, 76)">
    <circle cx="-6" cy="0" r="2.5" fill="white" opacity="0.6"/>
    <circle cx="0" cy="0" r="2.5" fill="white" opacity="0.6"/>
    <circle cx="6" cy="0" r="2.5" fill="white" opacity="0.6"/>
  </g>
</svg>