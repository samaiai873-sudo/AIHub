<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=440, height=280">
    <title>AIHub - Promotional Tile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
            color: #fff; 
            width: 440px; 
            height: 280px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .container { text-align: center; padding: 20px; }
        .logo { 
            width: 72px; height: 72px; 
            background: linear-gradient(135deg, #2d7ef7 0%, #6366f1 100%); 
            border-radius: 18px; 
            display: inline-flex; align-items: center; justify-content: center; 
            margin-bottom: 16px; font-size: 32px; font-weight: 700; color: white;
            box-shadow: 0 8px 32px rgba(45, 126, 247, 0.3);
        }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .tagline { font-size: 14px; color: #a5b4fc; margin-bottom: 20px; font-weight: 500; }
        .features { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .feature { font-size: 11px; padding: 4px 10px; background: rgba(45, 126, 247, 0.15); border: 1px solid rgba(45, 126, 247, 0.3); border-radius: 12px; color: #818cf8; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">AI</div>
        <h1>AIHub</h1>
        <p class="tagline">多 AI 聊天介面 · 本地模型 · MCP 整合</p>
        <div class="features">
            <span class="feature">ChatGPT</span>
            <span class="feature">Claude</span>
            <span class="feature">Gemini</span>
            <span class="feature">Ollama</span>
            <span class="feature">LM Studio</span>
            <span class="feature">MCP</span>
            <span class="feature">加密</span>
        </div>
    </div>
</body>
</html>
